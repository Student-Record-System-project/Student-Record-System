
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Linux and macOS CI
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsqlite3-dev sqlite3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite

      - name: Build student_system
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Iinclude -Isrc \
              $(find . -name '*.cpp' -not -path './tests/*') \
              -lsqlite3 -o student_system

      - name: Compile standalone C++ tests
        run: |
          set -e
          mkdir -p build/tests

          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
              tests/rbac_test.cpp \
              -o build/tests/rbac_test

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/audit_test.cpp src/audit.cpp \
              -lsqlite3 -o build/tests/audit_test

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/academic_validation_test.cpp \
              src/subjects.cpp src/grades.cpp src/audit.cpp \
              -lsqlite3 -o build/tests/academic_validation_test

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/performance_test.cpp \
              -lsqlite3 -o build/tests/performance_test

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              tests/sqlite_test.cpp \
              -lsqlite3 -o build/tests/sqlite_test

      - name: Run standalone C++ tests
        run: |
          set -e
          ./build/tests/rbac_test
          ./build/tests/audit_test
          ./build/tests/academic_validation_test
          ./build/tests/performance_test
          ./build/tests/sqlite_test

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: student_system-${{ matrix.os }}
          path: student_system
          retention-days: 7

      - name: Run attendance acceptance tests
        run: |
          chmod +x verify_attendance.sh
          ./verify_attendance.sh

      - name: Run academic reports acceptance tests
        run: |
          chmod +x verify_reports.sh
          ./verify_reports.sh

  # Windows CI using MSYS2 UCRT64
  windows-build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
            zip

      - name: Build Windows executable
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Iinclude -Isrc \
              $(find . -name '*.cpp' -not -path './tests/*') \
              -lsqlite3 -lbcrypt -o student_system.exe

      - name: Compile standalone C++ tests
        run: |
          set -e
          mkdir -p build/tests

          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
              tests/rbac_test.cpp \
              -o build/tests/rbac_test.exe

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/audit_test.cpp src/audit.cpp \
              -lsqlite3 -o build/tests/audit_test.exe

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/academic_validation_test.cpp \
              src/subjects.cpp src/grades.cpp src/audit.cpp \
              -lsqlite3 -o build/tests/academic_validation_test.exe

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Isrc \
              tests/performance_test.cpp \
              -lsqlite3 -o build/tests/performance_test.exe

          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              tests/sqlite_test.cpp \
              -lsqlite3 -o build/tests/sqlite_test.exe

      - name: Run standalone C++ tests
        run: |
          set -e
          ./build/tests/rbac_test.exe
          ./build/tests/audit_test.exe
          ./build/tests/academic_validation_test.exe
          ./build/tests/performance_test.exe
          ./build/tests/sqlite_test.exe

      - name: Inspect Windows runtime dependencies
        run: |
          ldd student_system.exe

      - name: Prepare Windows runtime files
        run: |
          mkdir -p release
          cp student_system.exe release/

          ldd student_system.exe | \
            awk '{for (i=1; i<=NF; i++) if ($i ~ /^\/ucrt64\/bin\/.*\.dll$/) print $i}' | \
            sort -u > runtime-dlls.txt

          if [ ! -s runtime-dlls.txt ]; then
            echo "ERROR: No UCRT64 runtime DLL dependencies found."
            exit 1
          fi

          while IFS= read -r dll; do
            test -f "$dll"
            cp "$dll" release/
          done < runtime-dlls.txt

          ls -lh release/

      - name: Run attendance acceptance tests
        run: |
          chmod +x verify_attendance.sh
          ./verify_attendance.sh

      - name: Run academic reports acceptance tests
        run: |
          chmod +x verify_reports.sh
          ./verify_reports.sh

      - name: Package Windows application
        run: |
          cp README.md release/
          cd release
          zip -r ../StudentRecordSystem-Windows.zip .

      - name: Upload Windows application package
        uses: actions/upload-artifact@v4
        with:
          name: StudentRecordSystem-Windows
          path: StudentRecordSystem-Windows.zip
          retention-days: 30
  coverage:
    name: Code Coverage (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsqlite3-dev sqlite3 gcovr

      - name: Build audit coverage test
        run: |
          mkdir -p build/coverage/audit

          cd build/coverage/audit

          g++ -std=c++17 -O0 -g --coverage \
              -I../../../include -I../../../src \
              ../../../tests/audit_test.cpp \
              ../../../src/audit.cpp \
              -lsqlite3 -o audit_test

      - name: Build academic validation coverage test
        run: |
          mkdir -p build/coverage/academic

          cd build/coverage/academic

          g++ -std=c++17 -O0 -g --coverage \
              -I../../../include -I../../../src \
              ../../../tests/academic_validation_test.cpp \
              ../../../src/subjects.cpp \
              ../../../src/grades.cpp \
              ../../../src/audit.cpp \
              -lsqlite3 -o academic_validation_test

      - name: Run audit coverage test
        working-directory: build/coverage/audit
        run: ./audit_test

      - name: Run academic validation coverage test
        working-directory: build/coverage/academic
        run: ./academic_validation_test

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter 'src/' \
            --exclude 'src/main.cpp' \
            --exclude-unreachable-branches \
            --print-summary \
            --xml-pretty \
            --output coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: student-system-coverage
          path: coverage.xml
          retention-days: 30